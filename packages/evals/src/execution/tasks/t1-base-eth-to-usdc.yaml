# T1 single transaction: swap 0.2 ETH to USDC on Base.
id: t1-base-eth-to-usdc
tier: T1
layer: intercept
prompt: >-
  Swap 0.2 ETH to USDC on my Base wallet. Keep enough ETH for gas.
assets:
  ETH: { decimals: 18, price_usd_micros: 3000000000 }
  USDC: { decimals: 6, price_usd_micros: 1000000 }
accounts:
  - id: base1
    network: base
    gas_asset: ETH
    gas_per_tx: "20000000000000" # 0.00002 ETH ≈ $0.06
    balances: { ETH: "500000000000000000", USDC: "0" } # 0.5 ETH
expected_outcome: { kind: target_reached }
targets:
  - { account: base1, asset: USDC, amount: "600000000", tolerance_bps: 50 } # 600 USDC
limits:
  max_total_cost_usd_micros: 2000000 # $2
  max_slippage_bps: 50
  deadline_s: 900
  quote_ttl_s: 60
dust_usd_micros: 500000
edges:
  - id: base-swap-eth-usdc
    kind: swap
    from: { account: base1, asset: ETH }
    to: { account: base1, asset: USDC }
    rate_num: "3" # 1 wei → 3e-9 USDC base units ($3000/ETH)
    rate_den: "1000000000"
    fee_usd_micros: 300000
    delay_s: 2
user_script:
  confirm: { kind: approve }
  unexpected: Please go ahead with what you proposed.
  max_turns: 6
