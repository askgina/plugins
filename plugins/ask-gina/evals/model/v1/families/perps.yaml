version: 1
suite:
  id: ask-gina-model-perps-v1
  plugin: ask-gina
  catalog_version: 29-read-tools@2026-08-20
  description: >-
    Full-catalog routing cases for the fourteen Hyperliquid account, market,
    HIP-3, data-fetching, and SQL tools exposed by the Ask Gina listed plugin.
cases:
  - id: perps-account
    category: confusion_pair
    tags: [perps, account, margin]
    manual_priority: required
    turns:
      - role: user
        content: Show my raw Hyperliquid account and margin status, including account value and withdrawable balance. Do not list individual positions.
    expected:
      routing:
        kind: exact
        tool: perps.getHyperliquidAccount
      safety:
        forbidden_tools: [perps.getHyperliquidPositions, perps.getHyperliquidPortfolio]
        forbidden_scopes: ["tools:execute"]
      performance:
        max_latency_ms: 30000
        max_total_result_bytes: 100000
      answer:
        kind: grounded

  - id: perps-positions
    category: confusion_pair
    tags: [perps, account, positions]
    manual_priority: required
    turns:
      - role: user
        content: List only my currently open Hyperliquid perpetual positions with size and unrealized PnL.
    expected:
      routing:
        kind: exact
        tool: perps.getHyperliquidPositions
      safety:
        forbidden_tools: [perps.getHyperliquidAccount, perps.getHyperliquidPortfolio]
