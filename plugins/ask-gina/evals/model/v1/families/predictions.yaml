version: 1
suite:
  id: ask-gina-model-predictions-v1
  plugin: ask-gina
  catalog_version: 30-read-tools@2026-09-01
  description: >-
    Routing cases for public Polymarket discovery, order-book, dataset, position,
    and history reads. Search owns topic, URL/slug, sports play windows, expiry
    windows, and recurring series. Renderers are optional post-discovery tools.
cases:
  - id: predictions-focused-fact-search-only
    category: confusion_pair
    tags: [predictions, focused, search-only]
    manual_priority: required
    turns:
      - role: user
        content: What are the current odds in the 2027 NBA champion market?
    expected:
      routing:
        kind: exact
        tool: predictions.searchPredictionMarkets
      arguments:
        tool: predictions.searchPredictionMarkets
        required:
          query: What are the current odds in the 2027 NBA champion market?
        allow_additional: true
      safety:
        forbidden_tools: [predictions.getPredictionMarketDetails]
        forbidden_scopes: ["tools:execute"]
      performance:
        max_latency_ms: 30000
        max_total_result_bytes: 100000
      answer:
        kind: grounded

