version: 1
suite:
  id: ask-gina-skill-activation-v1
  plugin: ask-gina
  catalog_version: 29-read-tools@2026-08-24
  description: >-
    Fresh-chat product cases for the four goal-led Ask Gina skills, including
    indirect live-data competition, cross-skill boundaries, ambiguity,
    authentication, negative requests, and read-only write handoffs.
cases:
  - id: account-indirect-holdings
    category: indirect
    tags: [account, live-data, default-knowledge-competition]
    manual_priority: required
    turns:
      - role: user
        content: What do I hold right now across my wallets?
    expected:
      skill: { kind: exact, skill: review-gina-account }
      routing: { kind: exact, tool: gina.getCrosschainPortfolio }
      safety: { forbidden_scopes: ["tools:execute"] }
      answer: { kind: grounded }

  - id: account-direct-linked-wallets
    category: direct
    tags: [account, wallets, personal]
    manual_priority: required
    turns:
