    copilot: Ask Gina Perps lets an agent read Hyperliquid account and market data and, with your approval, place, change and cancel perpetual-futures orders, adjust leverage, and deposit or withdraw funds from your Gina wallet. It also renders charts, positions and account overviews. Orders and funding move real money, so review every action before you approve it.
  codex:
    shortDescription: Hyperliquid perps trading
    longDescription: Ask Gina Perps connects your Ask Gina account to the Perps MCP server. It can read Hyperliquid account, position, order, market and HIP-3 data and, with your approval, place, change and cancel perpetual-futures orders, adjust leverage, and deposit or withdraw funds from your Gina wallet. It also renders charts, positions and account overviews. Orders and funding move real money, so review each action before you approve it. The plugin bundles no skills.
