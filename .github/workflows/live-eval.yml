name: Live eval

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Repository-relative eval suite path
        required: true
        default: packages/evals/src/fixtures/ask-gina-routing-smoke.yaml
        type: string
      run_id:
        description: Safe unique run identifier
        required: true
        type: string
      candidate:
        description: Safe candidate identifier
        required: true
        type: string
      model:
        description: OpenAI Responses model
        required: true
        default: gpt-5.1
        type: string
      reasoning:
        description: Responses reasoning effort
        required: true
        default: medium
        type: choice
        options:
          - low
          - medium
          - high
      repetitions:
        description: Repetitions per case (3 to 5)
        required: true
        default: "3"
        type: string
      account_class:
        description: Sanitized account-class label
        required: true
        default: eval
        type: string
      timeout_ms:
        description: Per-trial timeout in milliseconds
        required: true
        default: "120000"
        type: string

permissions:
  contents: read

concurrency:
  group: live-eval-responses
  cancel-in-progress: false

jobs:
  responses:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: live-evals
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Run Responses eval
        env:
          ASK_GINA_ACCESS_TOKEN: ${{ secrets.ASK_GINA_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_SUITE: ${{ inputs.suite }}
          EVAL_RUN_ID: ${{ inputs.run_id }}
          EVAL_CANDIDATE: ${{ inputs.candidate }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_REASONING: ${{ inputs.reasoning }}
          EVAL_REPETITIONS: ${{ inputs.repetitions }}
          EVAL_ACCOUNT_CLASS: ${{ inputs.account_class }}
          EVAL_TIMEOUT_MS: ${{ inputs.timeout_ms }}
        run: >-
          bun run eval:responses --
          --suite "$EVAL_SUITE"
          --run-id "$EVAL_RUN_ID"
          --candidate "$EVAL_CANDIDATE"
          --model "$EVAL_MODEL"
          --reasoning "$EVAL_REASONING"
          --repetitions "$EVAL_REPETITIONS"
          --account-class "$EVAL_ACCOUNT_CLASS"
          --timeout-ms "$EVAL_TIMEOUT_MS"
      - name: Upload sanitized aggregate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-eval-responses-${{ github.run_id }}
          path: .plugin-eval-runs/*.json
          if-no-files-found: warn
          retention-days: 7
