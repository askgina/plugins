name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.7.0
      - run: bun install --frozen-lockfile
      - run: bun run audit
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - run: bun run check:target-conformance
      - run: bun run artifacts
      - run: bun run verify:artifacts
      - run: bun run smoke:install
      - run: bun run check:public-boundary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: receipts
          path: dist/receipts
          retention-days: 7
